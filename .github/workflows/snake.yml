name: 生成贡献 Snake

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 0 点更新
  workflow_dispatch:       # 支持手动触发
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 生成贡献 Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contribution-snake.svg

      - name: 提交更新
        uses: EndBug/add-and-commit@v9
        with:
          message: "🐍 自动更新贡献活动图"
          add: "assets/contribution-snake.svg"
          default_author: github_actions
