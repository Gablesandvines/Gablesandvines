  </g>

  <!-- 主标题 -->
  <text x="64" y="168" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="88" font-weight="700" fill="url(#accent)" letter-spacing="1">zhone</text>
  <!-- 副标题 -->
  <text x="68" y="226" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="400" fill="#c0caf5">全栈开发者 · AI Agent 与自动化探索者</text>
