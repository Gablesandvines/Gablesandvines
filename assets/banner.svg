    <!-- 行 1 -->
    <circle cx="860" cy="40" r="6"/><circle cx="892" cy="40" r="6"/><circle cx="924" cy="40" r="6" fill="#3aa675"/><circle cx="956" cy="40" r="6"/><circle cx="988" cy="40" r="6" fill="#2f7d5b"/><circle cx="1020" cy="40" r="6"/><circle cx="1052" cy="40" r="6" fill="#3aa675"/><circle cx="1084" cy="40" r="6"/><circle cx="1116" cy="40" r="6" fill="#2f7d5b"/><circle cx="1148" cy="40" r="6"/>
    <!-- 行 2 -->
    <circle cx="860" cy="72" r="6" fill="#3aa675"/><circle cx="892" cy="72" r="6"/><circle cx="924" cy="72" r="6"/><circle cx="956" cy="72" r="6" fill="#2f7d5b"/><circle cx="988" cy="72" r="6"/><circle cx="1020" cy="72" r="6" fill="#3aa675"/><circle cx="1052" cy="72" r="6"/><circle cx="1084" cy="72" r="6"/><circle cx="1116" cy="72" r="6" fill="#2f7d5b"/><circle cx="1148" cy="72" r="6" fill="#3aa675"/>
    <!-- 行 3 -->
    <circle cx="860" cy="104" r="6"/><circle cx="892" cy="104" r="6" fill="#2f7d5b"/><circle cx="924" cy="104" r="6" fill="#3aa675"/><circle cx="956" cy="104" r="6"/><circle cx="988" cy="104" r="6"/><circle cx="1020" cy="104" r="6" fill="#2f7d5b"/><circle cx="1052" cy="104" r="6" fill="#3aa675"/><circle cx="1084" cy="104" r="6"/><circle cx="1116" cy="104" r="6"/><circle cx="1148" cy="104" r="6" fill="#2f7d5b"/>
    <!-- 行 4 -->
    <circle cx="860" cy="136" r="6" fill="#3aa675"/><circle cx="892" cy="136" r="6"/><circle cx="924" cy="136" r="6"/><circle cx="956" cy="136" r="6" fill="#3aa675"/><circle cx="988" cy="136" r="6" fill="#2f7d5b"/><circle cx="1020" cy="136" r="6"/><circle cx="1052" cy="136" r="6"/><circle cx="1084" cy="136" r="6" fill="#3aa675"/><circle cx="1116" cy="136" r="6" fill="#2f7d5b"/><circle cx="1148" cy="136" r="6"/>
    <!-- 行 5 -->
    <circle cx="860" cy="168" r="6"/><circle cx="892" cy="168" r="6" fill="#2f7d5b"/><circle cx="924" cy="168" r="6"/><circle cx="956" cy="168" r="6"/><circle cx="988" cy="168" r="6" fill="#3aa675"/><circle cx="1020" cy="168" r="6"/><circle cx="1052" cy="168" r="6" fill="#2f7d5b"/><circle cx="1084" cy="168" r="6"/><circle cx="1116" cy="168" r="6" fill="#3aa675"/><circle cx="1148" cy="168" r="6"/>
